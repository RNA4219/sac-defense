name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install coverage==7.13.4
      - run: python -m compileall -q sac_defense
      - run: python -m coverage run --source=sac_defense -m unittest discover -s tests -v
      - run: python -m coverage report --omit=sac_defense/demo_backend.py,sac_defense/lab_backend.py,sac_defense/__main__.py --fail-under=80
      - run: docker compose config --quiet
      - run: bash tests/compose_smoke.sh
      - run: bash tests/linux_benign_smoke.sh "$RUNNER_TEMP/linux-benign.json"
      - run: python -c "import json,os; d=json.load(open(os.environ['RUNNER_TEMP']+'/linux-benign.json')); assert d['added_p95_ms'] <= 30 and d['negative_control_mismatches'] == 0 and d['decoy_routes'] == 0 and d['recorded_route_events'] == d['pairs']"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-benign-measurement
          path: ${{ runner.temp }}/linux-benign.json
