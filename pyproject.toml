[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sac-defense"
version = "0.2.0"
description = "Stateful defensive deception for authorized HTTP services"
requires-python = ">=3.11"
license = {text = "MIT"}

[project.scripts]
sac-defense = "sac_defense.cli:main"

[tool.setuptools]
packages = ["sac_defense"]
